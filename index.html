<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside>
            <div class="logo">✦ Nova AI</div>
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>

            <div class="modes-section">
                <h3>AI Modes</h3>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="general">💬 General AI</button>
                    <button class="mode-btn" data-mode="study">📚 Study AI</button>
                    <button class="mode-btn" data-mode="coding">💻 Coding AI</button>
                    <button class="mode-btn" data-mode="research"> Research AI</button>
                </div>
                <p class="future-modules">Future modules: Vision · Voice · Files · Agents</p>
            </div>

            <div class="active-mode">
                <span class="menu-icon">☰</span>
                <span class="mode-name" id="activeModeName">General AI</span>
                <span class="status">Online</span>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main>
            <div class="hero">
                <h1>What can I help you with?</h1>
                <p>Your all-in-one AI workspace.</p>
            </div>

            <div class="suggestions">
                <button class="suggestion-chip">Explain AI</button>
                <button class="suggestion-chip">Teach coding</button>
                <button class="suggestion-chip">Help me study</button>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" placeholder="Message Nova AI..." id="chatInput">
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>

            <p class="footer-note">AI can make mistakes. Check important information.</p>
        </main>
    </div>

    <script src="App.js"></script>
</body>
                  </html>
