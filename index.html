<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>
<style>
:root{--g:#1f9d63;--side:#0a1f1a;--bg:#f4f7f6;--card:#fff;--tx:#14231e;--mu:#6b7c75;--bd:#e2e9e6}
[data-theme=dark]{--bg:#0d1714;--card:#14221d;--tx:#e8f1ed;--mu:#8fa39b;--bd:#223630}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#06140f,#0f3d2c)}
.box{background:#fff;color:#14231e;border-radius:16px;padding:26px;width:100%;max-width:380px}
.box h2{margin:0 0 4px}.box p{margin:0 0 12px;color:#6b7c75}
.box label{display:block;font-size:13px;margin:10px 0 4px}
.box input{background:#f7faf9;color:#14231e;border-color:#e2e9e6}
.box .btn{width:100%;margin-top:14px}
#err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
.lnk{background:none;border:0;color:var(--g);font-weight:600;padding:0}
#app{display:flex;height:100%}
aside{width:240px;background:var(--side);color:#dcebe5;display:flex;flex-direction:column;padding:16px;gap:4px;flex-shrink:0}
.brand{font-size:20px;font-weight:700;margin-bottom:14px}.brand span{color:#3ddc97}
aside .nav{background:none;border:0;color:inherit;text-align:left;padding:11px 12px;border-radius:10px}
aside .nav.on{background:var(--g);color:#fff}
.me{margin-top:auto;border-top:1px solid #1d3a31;padding-top:12px;font-size:14px}
.me small{display:block;color:#8fb3a5}
main{flex:1;display:flex;flex-direction:column;min-width:0}
