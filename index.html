<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>
<link rel="stylesheet" href="style.css"></head><body>

<div id="auth" hidden><div class="box">
<button class="x" id="ax" aria-label="Close">✕</button>
<h2 id="at">Log in</h2><p id="am">Log in to continue.</p>
<div id="nm" hidden><label>Full name</label><input id="name" autocomplete="name"></div>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<div id="err"></div>
<button class="btn" id="go">Log in</button>
<p style="margin-top:14px;text-align:center"><span id="sw">Don't have an account?</span> <button class="lnk" id="tg">Sign Up</button></p>
</div></div>

<div id="app">
<aside id="side"><div class="brand">✦ Nova <span>AI</span></div>
<button class="nav" data-v="home">🏠 Home</button>
<button class="nav on" data-v="chat" id="newc">💬 New Chat</button>
<button class="nav" data-v="history">🕘 Chat History</button>
<button class="nav" data-v="saved">🔖 Saved Items</button>
<button class="nav" data-v="tools">🧰 Tools</button>
<button class="nav" data-v="settings">⚙️ Settings</button>
<div class="me"><span id="mn">Guest</span><small id="mr"></small>
<button class="btn" id="li">Log in / Sign up</button>
<button class="btn o" id="up">⭐ Upgrade to Pro</button></div></aside>
<main><header><button id="burger" aria-label="Menu">☰</button><h3 id="ttl">New Chat</h3></header>

<section class="view" id="v-home"><h2 id="hi"></h2><p style="color:var(--mu)">Your coding and study assistant.</p>
<div class="grid">
<button class="card" data-p="">💬<b>Ask Anything</b><span>Get helpful answers in seconds.</span></button>
<button class="card" data-p="Explain this topic step by step: ">📖<b>Study &amp; Learn</b><span>Simplify complex topics.</span></button>
<button class="card" data-p="Help me write and fix this code: ">💻<b>Code Help</b><span>Write, explain and debug code.</span></button>
<button class="card" data-p="Give me creative ideas about: ">💡<b>Explore Ideas</b><span>Turn thoughts into results.</span></button></div>
<div class="hero"><b>Your goals. Our support.</b><br>Nova AI helps you learn, solve and create.<br><button class="btn" id="startc">Start a new chat</button></div>
<h3>Quick Actions</h3><div class="chips" id="qa"></div></section>

<section class="view on" id="v-chat"><div id="msgs"></div>
<div id="pv" hidden></div>
<div class="comp"><button class="ic" id="bf" aria-label="Attach file">📎</button><button class="ic" id="bi" aria-label="Add image">🖼️</button><textarea id="inp" placeholder="Ask Nova anything..."></textarea><button class="btn" id="send">Send</button></div></section>
<section class="view" id="v-history"></section>
<section class="view" id="v-saved"></section>
<section class="view" id="v-tools"><div class="grid" id="tl"></div></section>
<section class="view" id="v-settings"><div class="set">
<label>Name</label><input id="sn">
<label>Role</label><select id="sr"><option>Student</option><option>Teacher</option><option>Staff</option></select>
<button class="btn" id="ss" style="margin-top:14px">Save changes</button>
<label>Appearance</label><button class="btn o" id="dk">Switch light / dark</button>
<label>Data</label><button class="btn o" id="cl">Clear my chats</button>
<label>Account</label><button class="btn o" id="lo">Log out</button></div></section>
</main></div>
<input type="file" id="fi" hidden accept=".txt,.md,.csv,.json,.js,.py,.html,.css,.java,.c,.cpp,.php,.sql,.xml,.ts,text/*">
<input type="file" id="ii" hidden accept="image/*">
<div id="toast"></div>
<script src="App.js"></script></body></html>
